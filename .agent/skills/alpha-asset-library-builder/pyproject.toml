[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alpha-asset-library-builder"
version = "1.0.0"
description = "Resumable alpha-channel PNG sheet extraction for asset libraries."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "Pillow>=10.0",
  "numpy>=1.26",
  "opencv-python-headless>=4.10",
  "pydantic>=2.7",
  "typer>=0.12",
  "rich>=13.7",
  "ImageHash>=4.3",
  "PyYAML>=6.0",
]

[project.scripts]
alpha-assets = "alpha_asset_builder.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["alpha_asset_builder*"]

