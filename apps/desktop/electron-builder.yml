appId: com.joymedia.worker-companion
productName: JOY Media Worker Companion
asar: true
directories:
  output: dist-installer
files:
  - dist/**
  - package.json
afterPack: scripts/sign-windows-artifacts.mjs
extraResources:
  - from: .runtime
    to: worker-runtime
    filter:
      - worker.js
      - worker.js.map
      - worker-integrity.json
win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: JOY-Media-Worker-Companion-${version}-${arch}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
