# JOY Media public editor and versioned API. Install as /etc/nginx/sites-available/joy-media.
limit_req_zone $binary_remote_addr zone=joymedia_api:10m rate=30r/s;

server {
    listen 80;
    listen 443 ssl;
    server_name media.joyteam.ir;

    ssl_certificate     /etc/ssl/joyteamir/origincertificate.pem;
    ssl_certificate_key /etc/ssl/joyteamir/privatekey.pem;

    # The trailing slash strips /api/ so the Node server receives /v1/...
    location /api/ {
        limit_req zone=joymedia_api burst=20 nodelay;
        proxy_pass http://127.0.0.1:8790/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location = /api/health {
        proxy_pass http://127.0.0.1:8790/health;
        proxy_set_header Host $host;
        access_log off;
    }

    root /opt/joy-media/web;
    location / {
        try_files $uri $uri/ /index.html;
        add_header X-Content-Type-Options nosniff always;
    }
}
