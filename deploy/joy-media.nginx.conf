# JOY Media public editor and versioned API.
#
# Live location note: these two server blocks are NOT installed as a
# standalone sites-available file â€” on the Sweden VPS they live inline inside
# /etc/nginx/conf.d/joy-wg-bot.conf (the consolidated config for all
# *.joyteam.ir subdomains). This file documents that live content so it isn't
# only a manual edit; keep both in sync by hand until that's automated.
#
# joyst.ir is the canonical domain as of 2026-07-30 and listens only on
# 82.115.8.224:443; 46.249.103.142:443 belongs to another site's default server.
# It uses a self-signed origin cert,
# Cloudflare SSL/TLS mode = Full, not strict). media.joyteam.ir is kept alive
# purely as a redirect so the super-app launcher (bot/webapp/client/index.js
# in the joy-vps repo) never had to change its media.joyteam.ir link.

server {
    listen 80;
    listen 82.115.8.224:443 ssl;
    http2 on;
    server_name joyst.ir www.joyst.ir;

    ssl_certificate     /etc/ssl/joyst/origincertificate.pem;
    ssl_certificate_key /etc/ssl/joyst/privatekey.pem;

    client_max_body_size 1200m;

    root /opt/joy-media/web;

    # Static requests must never be rewritten to the SPA shell. A missing or
    # unreadable release asset is a real 404 with its true content type.
    location ~* ^/(?:assets|effects|fonts|images|media|transitions|workers?|worklets?)/ {
        try_files $uri =404;
        add_header X-Content-Type-Options nosniff always;
    }

    location ~* \.(?:avif|bmp|css|gif|ico|jpe?g|js|json|mjs|map|mp3|mp4|ogg|otf|png|svg|ttf|wasm|wav|webm|webmanifest|webp|woff2?)$ {
        try_files $uri =404;
        add_header X-Content-Type-Options nosniff always;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header X-Content-Type-Options nosniff always;
    }

    # The trailing slash strips /api/ so the Node server receives /v1/...
    location ^~ /api/v1/agent/ {
        proxy_pass http://127.0.0.1:8790/v1/agent/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 90;
        proxy_send_timeout 90;
    }

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8790/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180;
        proxy_send_timeout 180;
    }

    location = /api/health {
        proxy_pass http://127.0.0.1:8790/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    location = /live {
        proxy_pass http://127.0.0.1:8790/live;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    location = /ready {
        proxy_pass http://127.0.0.1:8790/ready;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    location = /health/ready {
        proxy_pass http://127.0.0.1:8790/health/ready;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }
}

server {
    listen 80;
    listen 443 ssl;
    http2 on;
    server_name media.joyteam.ir;

    ssl_certificate     /etc/ssl/joyteamir/origincertificate.pem;
    ssl_certificate_key /etc/ssl/joyteamir/privatekey.pem;

    return 301 https://joyst.ir$request_uri;
}
