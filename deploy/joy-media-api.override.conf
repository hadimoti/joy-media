[Service]
# `current-api` changes atomically to a built, immutable release directory.
WorkingDirectory=/opt/joy-media/releases/current-api
EnvironmentFile=/etc/joy-media/api.env
# Owner-approved source: the existing Hermes OPENROUTER_API_KEY is copied once
# into this encrypted credential file; the API never reads Hermes/.env directly.
LoadCredentialEncrypted=openrouter-api-key:/etc/credstore.encrypted/openrouter-api-key
# Provider credentials are injected by systemd and read only at API startup.
# The API never receives these values through EnvironmentFile, Git, or HTTP.
LoadCredentialEncrypted=joy-media-pexels-api-key:/etc/credstore.encrypted/joy-media-pexels-api-key
LoadCredentialEncrypted=joy-media-pixabay-api-key:/etc/credstore.encrypted/joy-media-pixabay-api-key
ExecStart=
ExecStart=/usr/local/bin/node dist/server.js
