# JOY Media — Account Web & Hardened Control Plane Nginx Configuration
# Target server block for joyst.ir post-web-retirement.
# Serves the lean apps/account-web SPA and proxies ONLY the hardened control plane
# routes: auth (OTP), devices, account, entitlements, releases, billing, and agent (gateway).
# All retired project/media/legacy editor routes are rejected at the edge (404/410).

# BEGIN joy-media cloudflare-only geo (managed)
# 1 for Cloudflare edges (deploy/cloudflare-ips.txt) and this host's own probes.
# Keyed on the TCP peer, never on the client address rewritten from CF-Connecting-IP.
geo $realip_remote_addr $joy_media_from_cloudflare {
    default 0;
    173.245.48.0/20 1;
    103.21.244.0/22 1;
    103.22.200.0/22 1;
    103.31.4.0/22 1;
    141.101.64.0/18 1;
    108.162.192.0/18 1;
    190.93.240.0/20 1;
    188.114.96.0/20 1;
    197.234.240.0/22 1;
    198.41.128.0/17 1;
    162.158.0.0/15 1;
    104.16.0.0/13 1;
    104.24.0.0/14 1;
    172.64.0.0/13 1;
    131.0.72.0/22 1;
    2400:cb00::/32 1;
    2606:4700::/32 1;
    2803:f800::/32 1;
    2405:b500::/32 1;
    2405:8100::/32 1;
    2a06:98c0::/29 1;
    2c0f:f248::/32 1;
    # origin self-probes: loopback, joyst.ir listen address, deploy edge address
    127.0.0.1 1;
    ::1 1;
    82.115.8.224 1;
}
# END joy-media cloudflare-only geo (managed)

server {
    listen 80;
    listen 82.115.8.224:443 ssl;
    http2 on;
    server_name joyst.ir www.joyst.ir;

    ssl_certificate     /etc/ssl/joyst/origincertificate.pem;
    ssl_certificate_key /etc/ssl/joyst/privatekey.pem;

    # BEGIN joy-media realip (managed)
    # CF-Connecting-IP is authoritative because only Cloudflare CIDRs are trusted.
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;
    # END joy-media realip (managed)
    # BEGIN joy-media cloudflare-only (managed)
    # Close connections that did not arrive from a Cloudflare edge or this host.
    if ($joy_media_from_cloudflare = 0) {
        return 444;
    }
    # END joy-media cloudflare-only (managed)

    # Tight body size limit now that video media uploads are eliminated from the web edge
    client_max_body_size 10m;

    # Static root serves apps/account-web production build
    root /opt/joy-media/account-web;

    # Immutable hashed static assets
    location ~* ^/assets/.*\.(?:css|js|woff2?|png|svg|ico)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
    }

    # Standard static assets
    location ~* \.(?:css|ico|js|json|mjs|map|png|svg|webmanifest|webp|woff2?)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600";
        add_header X-Content-Type-Options nosniff always;
    }

    # Direct installer and release bundle downloads
    location ^~ /releases/ {
        alias /opt/joy-media/releases/;
        try_files $uri =404;
        add_header Content-Disposition 'attachment';
        add_header X-Content-Type-Options nosniff always;
    }

    # SPA routing fallback
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
    }

    # Hardened API Proxy: Only allow control plane routes + Joy Model Gateway
    # Routes: /v1/auth/*, /v1/devices*, /v1/account/*, /v1/entitlements/*, /v1/releases/*, /v1/billing/*, /v1/agent/*
    location ~ ^/api/v1/agent(?:/|$) {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:8790;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 90;
        proxy_send_timeout 90;
    }

    location ~ ^/api/v1/(?:auth|devices|account|entitlements|releases|billing)(?:/|$) {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:8790;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180;
        proxy_send_timeout 180;
    }

    # Health & readiness probes
    location = /api/health {
        proxy_pass http://127.0.0.1:8790/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        access_log off;
    }

    location = /live {
        proxy_pass http://127.0.0.1:8790/live;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        access_log off;
    }

    location = /ready {
        proxy_pass http://127.0.0.1:8790/ready;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        access_log off;
    }

    location = /health/ready {
        proxy_pass http://127.0.0.1:8790/health/ready;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        access_log off;
    }

    location /internal/ {
        return 404;
    }

    # Edge denial for retired project/media/editor APIs
    location /api/ {
        return 404;
    }
}

server {
    listen 80;
    listen 443 ssl;
    http2 on;
    server_name media.joyteam.ir;

    ssl_certificate     /etc/ssl/joyteamir/origincertificate.pem;
    ssl_certificate_key /etc/ssl/joyteamir/privatekey.pem;

    return 301 https://joyst.ir$request_uri;
}
