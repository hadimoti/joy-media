# JOY Media — Account Web & Hardened Control Plane Nginx Configuration
# Target server block for joyst.ir post-web-retirement.
# Serves the lean apps/account-web SPA and proxies ONLY the hardened control plane
# routes: auth (OTP), devices, account, entitlements, releases, billing, and agent (gateway).
# All retired project/media/legacy editor routes are rejected at the edge (404/410).

server {
    listen 80;
    listen 443 ssl;
    http2 on;
    server_name joyst.ir www.joyst.ir;

    ssl_certificate     /etc/ssl/joyst/origincertificate.pem;
    ssl_certificate_key /etc/ssl/joyst/privatekey.pem;

    # Tight body size limit now that video media uploads are eliminated from the web edge
    client_max_body_size 10m;

    # Static root serves apps/account-web production build
    root /opt/joy-media/account-web;

    # Immutable hashed static assets
    location ~* ^/assets/.*\.(?:css|js|woff2?|png|svg|ico)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
    }

    # Standard static assets
    location ~* \.(?:css|ico|js|json|mjs|map|png|svg|webmanifest|webp|woff2?)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600";
        add_header X-Content-Type-Options nosniff always;
    }

    # Direct installer and release bundle downloads
    location ^~ /releases/ {
        alias /opt/joy-media/releases/;
        try_files $uri =404;
        add_header Content-Disposition 'attachment';
        add_header X-Content-Type-Options nosniff always;
    }

    # SPA routing fallback
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
    }

    # Hardened API Proxy: Only allow control plane routes + Joy Model Gateway
    # Routes: /v1/auth/*, /v1/devices*, /v1/account/*, /v1/entitlements/*, /v1/releases/*, /v1/billing/*, /v1/agent/*
    location ~ ^/api/v1/agent(?:/|$) {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:8790;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 180;
        proxy_send_timeout 180;
    }

    location ~ ^/api/v1/(?:auth|devices|account|entitlements|releases|billing)(?:/|$) {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:8790;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180;
        proxy_send_timeout 180;
    }

    # Health & readiness probes
    location = /api/health {
        proxy_pass http://127.0.0.1:8790/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    location = /live {
        proxy_pass http://127.0.0.1:8790/live;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    location = /ready {
        proxy_pass http://127.0.0.1:8790/ready;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    location = /health/ready {
        proxy_pass http://127.0.0.1:8790/health/ready;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    # Edge denial for retired project/media/editor APIs
    location /api/ {
        return 404;
    }
}

server {
    listen 80;
    listen 443 ssl;
    http2 on;
    server_name media.joyteam.ir;

    ssl_certificate     /etc/ssl/joyteamir/origincertificate.pem;
    ssl_certificate_key /etc/ssl/joyteamir/privatekey.pem;

    return 301 https://joyst.ir$request_uri;
}
