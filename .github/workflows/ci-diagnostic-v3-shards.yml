# Isolated diagnostic (D18). The shard job below is copied from release-candidate-v3.yml (generated, not edited by hand), so this run
# reproduces the shard step of the shadow comparison on the same candidate and toolchain. It writes nothing to the release gate or the
# durable store.
name: ci-diagnostic-v3-shards

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Full 40-character commit SHA to diagnose
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: ci-diagnostic-v3-shards-${{ inputs.candidate_sha }}
  cancel-in-progress: false

env:
  CANDIDATE_SHA: ${{ inputs.candidate_sha }}

jobs:
  hosted-verify-shard:
    name: hosted-verify shard ${{ matrix.shard }} of 3
    runs-on: ubuntu-24.04
    # validate-candidate is not part of this diagnostic; the shard step below verifies the exact candidate SHA itself.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    timeout-minutes: 90
    env:
      JOY_TEST_DATABASE_URL: postgres://joy_media:joy_media@localhost:5432/joy_media_test
      JOY_MEDIA_EDGE_URL: off
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: joy_media
          POSTGRES_PASSWORD: joy_media
          POSTGRES_DB: joy_media_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U joy_media -d joy_media_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Verify exact candidate and pinned pnpm
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'candidate_sha must be a full lowercase commit SHA' >&2; exit 1; }
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA" || { echo 'hosted-verify checkout does not match candidate_sha' >&2; exit 1; }
          corepack enable pnpm
          test "$(pnpm --version)" = '11.15.0'
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      # The development verification runs `pnpm typecheck` (tsc -b) before its tests (ci-dev.yml static job, through `pnpm check`). The
      # tests import the project references that tsc -b emits, such as apps/worker/dist and the plugin SDK bin, so the shard runs the same
      # step. Without it, run 40448401792 failed the local Worker tests ("Worker build missing") and the plugin SDK CLI test.
      - name: Emit the project references the tests import (the development verification's typecheck step)
        shell: bash
        run: |
          set -euo pipefail
          pnpm typecheck
      # The same media and browser toolchain as the development verification (ci-dev.yml static job). The full suite needs ffmpeg and
      # Chromium: without them the shards failed in run 40424941725 before any test could pass.
      - name: Install pinned FFmpeg (BtbN n8.1.3-24-g92611900bb, SHA-256 verified)
        shell: bash
        env:
          FFMPEG_URL: https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-10-23-13-04/ffmpeg-n8.1.3-24-g92611900bb-linux64-gpl-8.1.tar.xz
          FFMPEG_SHA256: d0eb612b8994407f78413e2929cb4b073bc699c8ab79e198b31624736fdc2f93
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/ffmpeg-linux64.tar.xz"
          curl --fail --location --silent --show-error --retry 3 --output "$archive" "$FFMPEG_URL"
          echo "$FFMPEG_SHA256  $archive" | sha256sum --check --strict
          tar -xJf "$archive" -C "$RUNNER_TEMP"
          bin_dir="$RUNNER_TEMP/ffmpeg-n8.1.3-24-g92611900bb-linux64-gpl-8.1/bin"
          version_output="$("$bin_dir/ffmpeg" -version)"
          case "$version_output" in
            *'n8.1.3-24-g92611900bb'*) ;;
            *) echo 'pinned FFmpeg build identity not found in ffmpeg -version' >&2; exit 1 ;;
          esac
          "$bin_dir/ffprobe" -version > /dev/null
          echo "$bin_dir" >> "$GITHUB_PATH"
      - name: Verify the media toolchain
        shell: bash
        run: |
          set -euo pipefail
          ffmpeg -version
          ffprobe -version
      - name: Install Playwright Chromium and verify its executable
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec playwright install --with-deps chromium
          chromium_path="$(node -e "process.stdout.write(require('@playwright/test').chromium.executablePath())")"
          test -x "$chromium_path" || { echo 'Locked Playwright Chromium executable is missing' >&2; exit 1; }
          echo "JOY_CHROMIUM_PATH=$chromium_path" >> "$GITHUB_ENV"
      - name: Run Vitest shard ${{ matrix.shard }} of 3 (retries disabled, JSON report)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test-output/hosted-verify
          node node_modules/vitest/vitest.mjs run --retry=0 --shard=${{ matrix.shard }}/3 --reporter=json --outputFile=test-output/hosted-verify/shard-${{ matrix.shard }}.json
          test -s test-output/hosted-verify/shard-${{ matrix.shard }}.json
      # Transport only: the merge job reads the report from this run alone. The merge decides whether the shards are complete.
      - name: Upload the shard report (one day, this run only)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: joy-media-hosted-shard-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.candidate_sha }}-${{ matrix.shard }}
          path: test-output/hosted-verify/shard-${{ matrix.shard }}.json
          retention-days: 1
          if-no-files-found: error
  shard-summary:
    name: shard summary (counts and every failed test)
    runs-on: ubuntu-24.04
    needs: [hosted-verify-shard]
    if: always()
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: joy-media-hosted-shard-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.candidate_sha }}-*
          path: shards
      - name: Print the counts and every failed test of each shard
        shell: bash
        run: |
          set -uo pipefail
          found=0
          for report in $(find shards -name "*.json" | sort); do
            found=1
            echo "== $report"
            node -e "const r = JSON.parse(require('fs').readFileSync(process.argv[1], 'utf8')); console.log('total', r.numTotalTests, 'passed', r.numPassedTests, 'failed', r.numFailedTests, 'pending', r.numPendingTests); for (const file of r.testResults ?? []) for (const a of file.assertionResults ?? []) if (a.status === 'failed') console.log('FAILED', file.name, '::', a.fullName);" "$report"
          done
          if [ "$found" -eq 0 ]; then echo "No shard report was uploaded."; fi
          exit 0
