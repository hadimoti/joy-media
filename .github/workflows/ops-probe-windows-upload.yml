# One-off throughput probe for the Windows runner's artifact upload. It writes 64 MiB of incompressible bytes and uploads them with
# the same action version and compression as the v3 release upload. The upload step fails after 15 minutes, so a stalled path shows
# as a failure rather than a hang. It runs only on a push to its own branch, deploys nothing and changes no candidate.
name: ops-probe-windows-upload

on:
  push:
    branches: [proposal/d18-runner-upload-probe]

permissions:
  contents: read

jobs:
  upload-probe:
    name: 64 MiB upload probe on the Windows runner
    runs-on: [self-hosted, windows, x64, joy-media-worker-docker]
    timeout-minutes: 30
    steps:
      - name: Write 64 MiB of incompressible bytes
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $directory = Join-Path $env:RUNNER_TEMP 'upload-probe'
          New-Item -ItemType Directory -Path $directory -Force | Out-Null
          $bytes = New-Object byte[] 67108864
          [System.Security.Cryptography.RandomNumberGenerator]::Create().GetBytes($bytes)
          [IO.File]::WriteAllBytes((Join-Path $directory 'probe.bin'), $bytes)
          Write-Host "wrote 64 MiB to $directory"
      - name: Upload the probe artifact (same action and compression as the v3 release upload)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        timeout-minutes: 15
        with:
          name: joy-media-upload-probe-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/upload-probe
          retention-days: 1
          if-no-files-found: error
          compression-level: 0
