name: ci

# DEVELOPMENT VERIFICATION (push-only legacy lane) — superseded by ci-dev.yml
# for the developer feedback loop. Kept here for the legacy `push to main`
# trigger. All jobs run on owner-controlled self-hosted runners, NOT on
# GitHub-hosted minutes: GitHub-hosted Actions minutes/billing are
# unavailable from Iran, so every job in this repository targets an
# allowed PC Docker self-hosted runner label. See:
#   - tooling/release/src/ci-runner-policy.test.ts (offline enforcement)
#   - ops/self-hosted/linux-runner/ (Linux Docker runner contract)
#   - docs/SELF-HOSTED-CI.md (the full runner policy)
#

on:
  workflow_dispatch:
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  check:
    runs-on: [self-hosted, linux, x64, joy-media-ci]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Verify runner toolchain
        shell: bash
        run: |
          set -euo pipefail
          node --version
          corepack enable pnpm
          pnpm --version
      - name: Install media toolchain
        shell: bash
        run: |
          set -euo pipefail
          ffmpeg -version
          ffprobe -version
      - run: pnpm install --frozen-lockfile
      - run: pnpm run verify:ci
  browser-e2e:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: desktop-primary
            spec: tests/e2e
            api_port: 4174
            web_port: 4173
          - project: desktop-compact
            spec: tests/e2e/wp32-responsive-checkpoints.spec.ts
            api_port: 4274
            web_port: 4273
          - project: desktop-minimum
            spec: tests/e2e/wp32-responsive-checkpoints.spec.ts
            api_port: 4374
            web_port: 4373
    runs-on: [self-hosted, linux, x64, joy-media-ci]
    timeout-minutes: 60
    env:
      CI: true
      PLAYWRIGHT_WORKERS: 1
      JOY_MEDIA_E2E_API_PORT: ${{ matrix.api_port }}
      JOY_MEDIA_E2E_WEB_PORT: ${{ matrix.web_port }}
      JOY_MEDIA_E2E_API_URL: http://127.0.0.1:${{ matrix.api_port }}
    steps:
      # runner.temp is not available in job-level env; set the paths here.
      - name: Set Playwright output paths
        shell: bash
        run: |
          echo "PLAYWRIGHT_HTML_REPORT=$RUNNER_TEMP/playwright-report-${{ matrix.project }}-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_ENV"
          echo "PLAYWRIGHT_TEST_RESULTS_DIR=$RUNNER_TEMP/playwright-test-results-${{ matrix.project }}-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Verify runner toolchain
        shell: bash
        run: |
          set -euo pipefail
          node --version
          corepack enable pnpm
          pnpm --version
      - name: Install media toolchain
        shell: bash
        run: |
          set -euo pipefail
          ffmpeg -version
          ffprobe -version
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec playwright install chromium
      - name: Run browser audit (${{ matrix.project }})
        run: pnpm exec playwright test ${{ matrix.spec }} --project=${{ matrix.project }} --workers=1
      - name: Verify no checkout residue (browser audit)
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          for output_path in "$PLAYWRIGHT_HTML_REPORT" "$PLAYWRIGHT_TEST_RESULTS_DIR"; do
            case "$output_path" in
              "$RUNNER_TEMP"/*) ;;
              *) echo "refusing to clean output outside RUNNER_TEMP: $output_path" >&2; exit 1 ;;
            esac
            rm -rf -- "$output_path" 2>/dev/null || true
          done
          test -z "$(git status --porcelain)"
