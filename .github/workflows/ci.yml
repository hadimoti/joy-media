name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: corepack enable pnpm
      - name: Install media toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
          ffmpeg -version
          ffprobe -version
      - run: pnpm install --frozen-lockfile
      - run: pnpm run verify:ci
      - run: pnpm run release:gate
      - name: Upload release gate evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-gate
          path: test-output/release-gate/
          if-no-files-found: error
  browser-e2e:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        project: [desktop-primary, desktop-compact, desktop-minimum]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: corepack enable pnpm
      - name: Install media toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
          ffmpeg -version
          ffprobe -version
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - name: Run browser audit (${{ matrix.project }})
        run: pnpm exec playwright test tests/e2e --project=${{ matrix.project }} --workers=1
        env:
          CI: true
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-evidence-${{ matrix.project }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
