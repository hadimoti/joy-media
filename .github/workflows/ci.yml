name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable pnpm
      - name: Install media toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
          ffmpeg -version
          ffprobe -version
      - run: pnpm install --frozen-lockfile
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high
      # The editor budget test reads Vite's generated manifest, so a clean CI
      # checkout must build the editor before `pnpm check` collects that test.
      - run: pnpm --filter @joy-media/editor-web build
      - run: pnpm check
      - run: pnpm release:gate:test
      - name: Run non-deploying release gate
        run: pnpm release:gate
        env:
          JOY_RELEASE_EVIDENCE: ${{ hashFiles('test-output/release-evidence.json') != '' && 'test-output/release-evidence.json' || '' }}
      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: joy-studio-release-evidence
          path: |
            test-output/release-gate
            test-output/browser
            test-output/goldens
          if-no-files-found: ignore
