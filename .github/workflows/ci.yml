name: ci
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  check:
    runs-on: [self-hosted, windows, x64, joy-media-ci]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Verify runner toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          node --version
          corepack enable pnpm
          pnpm --version
      - name: Install media toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ffmpeg -version
          ffprobe -version
      - run: pnpm install --frozen-lockfile
      - run: pnpm run verify:ci
  browser-e2e:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        project: [desktop-primary, desktop-compact, desktop-minimum]
    runs-on: [self-hosted, windows, x64, joy-media-ci]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Verify runner toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          node --version
          corepack enable pnpm
          pnpm --version
      - name: Install media toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ffmpeg -version
          ffprobe -version
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec playwright install chromium
      - name: Run browser audit (${{ matrix.project }})
        run: pnpm exec playwright test tests/e2e --project=${{ matrix.project }} --workers=1
        env:
          CI: true
