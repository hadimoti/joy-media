name: hosted-minutes-probe
on:
  push:
    branches: [codex/joy-live-director]
    paths: ['.github/workflows/hosted-minutes-probe.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: echo "GitHub-hosted runner is available"; uname -a; date -u
