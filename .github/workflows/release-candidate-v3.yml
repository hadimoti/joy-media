name: release-candidate-v3

# Candidate verification is manual and read-only. It does not publish, tag, deploy or merge.
# The source jobs test the exact candidate SHA. Receipt jobs read the dispatch commit because its
# committed evidence lives under docs/release/attended/<candidate sha>/.
# The attended gate validates those receipts on Linux and does not build or launch the desktop app.
# Every job uses an owner-controlled Linux runner; ci-runner-policy.test.ts pins the allowed labels.

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Full 40-character commit SHA to verify (must already be reachable from this repository remote)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-candidate-v3-${{ inputs.candidate_sha }}
  cancel-in-progress: false

env:
  CANDIDATE_SHA: ${{ inputs.candidate_sha }}

jobs:
  validate-candidate:
    name: validate-candidate
    runs-on: [self-hosted, linux, x64, joy-media-ci]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Validate immutable candidate input
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'candidate_sha must be a full lowercase commit SHA' >&2; exit 1; }
          resolved_sha="$(git rev-parse HEAD)"
          [[ "$resolved_sha" == "$CANDIDATE_SHA" ]] || { echo 'candidate_sha is not reachable from this repository' >&2; exit 1; }
      - name: Refuse a re-run (only the first attempt can produce evidence)
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = '1' || { echo 'release-candidate-v3 refuses a re-run: only attempt 1 can produce evidence' >&2; exit 1; }

  hosted-verify-shard:
    name: hosted-verify shard ${{ matrix.shard }} of 3
    runs-on: [self-hosted, linux, x64, joy-media-ci]
    needs: [validate-candidate]
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    timeout-minutes: 90
    env:
      JOY_MEDIA_EDGE_URL: off
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Verify exact candidate and pinned pnpm
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'candidate_sha must be a full lowercase commit SHA' >&2; exit 1; }
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA" || { echo 'hosted-verify checkout does not match candidate_sha' >&2; exit 1; }
          corepack enable pnpm
          test "$(pnpm --version)" = '11.15.0'
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Compile workspace dependencies for Vitest
        run: pnpm typecheck
      - name: Run Vitest shard ${{ matrix.shard }} of 3 (retries disabled, JSON report)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test-output/hosted-verify
          node node_modules/vitest/vitest.mjs run --retry=0 --shard=${{ matrix.shard }}/3 --reporter=dot --reporter=json --outputFile.json=test-output/hosted-verify/shard-${{ matrix.shard }}.json
          test -s test-output/hosted-verify/shard-${{ matrix.shard }}.json
      # Transport only: the merge job reads the report from this run alone. The merge decides whether the shards are complete.
      - name: Upload the shard report (one day, this run only)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: joy-media-hosted-shard-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.candidate_sha }}-${{ matrix.shard }}
          path: test-output/hosted-verify/shard-${{ matrix.shard }}.json
          retention-days: 1
          if-no-files-found: error

  hosted-prepare:
    name: hosted-prepare (collection, static commands, production audit)
    runs-on: [self-hosted, linux, x64, joy-media-ci]
    needs: [validate-candidate]
    timeout-minutes: 60
    # Collection and shards use the same environment so conditional suites match.
    env:
      JOY_MEDIA_EDGE_URL: off
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Verify exact candidate and pinned pnpm
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'candidate_sha must be a full lowercase commit SHA' >&2; exit 1; }
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA" || { echo 'hosted-prepare checkout does not match candidate_sha' >&2; exit 1; }
          corepack enable pnpm
          test "$(pnpm --version)" = '11.15.0'
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Run the static release commands once on this commit (typecheck, lint, format, goldens)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test-output/hosted-verify/prep
          node tooling/release/src/hosted-verify.mjs commands --out test-output/hosted-verify/prep/commands.json
      - name: Collect the full Vitest collection on this exact commit
        shell: bash
        run: |
          set -euo pipefail
          node node_modules/vitest/vitest.mjs list --json > test-output/hosted-verify/prep/list.json
          test -s test-output/hosted-verify/prep/list.json
      - name: Run the production dependency audit
        shell: bash
        run: pnpm run audit:prod
      # Transport only: the merge job reads the collection and the static results from this run alone.
      - name: Upload the collection and the static results (one day, this run only)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: joy-media-hosted-prepare-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.candidate_sha }}
          path: test-output/hosted-verify/prep
          retention-days: 1
          if-no-files-found: error

  hosted-verify:
    name: hosted-verify (merge and assemble; no dependency install)
    runs-on: [self-hosted, linux, x64, joy-media-ci]
    needs: [validate-candidate, hosted-verify-shard, hosted-prepare]
    timeout-minutes: 30
    outputs:
      report_sha256: ${{ steps.report.outputs.report_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Verify exact candidate
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'candidate_sha must be a full lowercase commit SHA' >&2; exit 1; }
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA" || { echo 'hosted-verify checkout does not match candidate_sha' >&2; exit 1; }
      - name: Download this run's Vitest shard reports (this run and this candidate only)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: joy-media-hosted-shard-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.candidate_sha }}-*
          path: test-output/hosted-verify/shards
          merge-multiple: true
      - name: Download this run's collection and static results (this run and this candidate only)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: joy-media-hosted-prepare-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.candidate_sha }}
          path: test-output/hosted-verify/prep
      - name: Merge the three shards against the collection (exact coverage, no failures)
        shell: bash
        run: |
          set -euo pipefail
          node tooling/release/src/hosted-verify.mjs merge \
            --list test-output/hosted-verify/prep/list.json \
            --reports test-output/hosted-verify/shards \
            --out test-output/hosted-verify/merge.json
      - name: Assemble and verify the hosted-verify report
        id: report
        shell: bash
        run: |
          set -euo pipefail
          node tooling/release/src/hosted-verify.mjs assemble \
            --merge test-output/hosted-verify/merge.json \
            --commands test-output/hosted-verify/prep/commands.json \
            --candidate-sha "$CANDIDATE_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --out test-output/hosted-verify/report.json
          digest="$(sha256sum test-output/hosted-verify/report.json | cut -d' ' -f1)"
          echo "report_sha256=$digest" >> "$GITHUB_OUTPUT"
      # Transport only: the gate checks the report's digest against the digest this job output, so a swapped file fails.
      - name: Upload the hosted-verify report (one day, this run only)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: joy-media-hosted-verify-report-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.candidate_sha }}
          path: test-output/hosted-verify/report.json
          retention-days: 1
          if-no-files-found: error

  node-contracts:
    name: node-contracts (Node ${{ matrix.node }})
    runs-on: [self-hosted, linux, x64, joy-media-ci]
    needs: [validate-candidate]
    strategy:
      fail-fast: false
      matrix:
        node: ['22.17.0', 24]
    timeout-minutes: 45
    env:
      JOY_MEDIA_EDGE_URL: off
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
      - name: Verify exact candidate and runtime
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          node --version
      - name: Install frozen dependencies
        shell: bash
        run: |
          set -euo pipefail
          corepack enable pnpm
          test "$(pnpm --version)" = '11.15.0'
          pnpm install --frozen-lockfile
      - name: Verify the runner's FFmpeg installation
        run: ffmpeg -version
      - name: Run full CLI contract suite on the supported Node version
        run: pnpm exec vitest run --retry=0 apps/cli/src --no-file-parallelism

  editor-web-bundle:
    name: editor-web-bundle (standard hosted Linux)
    runs-on: [self-hosted, linux, x64, joy-media-ci]
    needs: [validate-candidate]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Verify exact candidate and toolchain
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'candidate_sha must be a full lowercase commit SHA' >&2; exit 1; }
          resolved_sha="$(git rev-parse HEAD)"
          [[ "$resolved_sha" == "$CANDIDATE_SHA" ]] || { echo 'editor bundle checkout does not match candidate_sha' >&2; exit 1; }
          node --version
          corepack enable pnpm
          test "$(pnpm --version)" = '11.15.0'
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Build editor web bundle
        shell: bash
        run: |
          set -euo pipefail
          rm -rf apps/editor-web/dist
          pnpm --filter @joy-media/editor-web... build
      - name: Stage source-bound renderer artifact
        id: stage-renderer
        shell: bash
        env:
          EDITOR_WEB_ARTIFACT_DIR: ${{ runner.temp }}/joy-media-editor-web-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          rm -rf "$EDITOR_WEB_ARTIFACT_DIR"
          mkdir -p "$EDITOR_WEB_ARTIFACT_DIR"
          cp -a apps/editor-web/dist "$EDITOR_WEB_ARTIFACT_DIR/dist"
          node tooling/release/src/editor-web-artifact.mjs create \
            --candidate-sha "$CANDIDATE_SHA" \
            --lockfile pnpm-lock.yaml \
            --dist "$EDITOR_WEB_ARTIFACT_DIR/dist" \
            --manifest "$EDITOR_WEB_ARTIFACT_DIR/manifest.json"
      - name: Upload renderer artifact for the Windows package job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: joy-media-editor-web-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.candidate_sha }}
          path: ${{ runner.temp }}/joy-media-editor-web-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 1
          if-no-files-found: error

  # The self-hosted runner must provide the candidate release files at
  # $JOY_MEDIA_CI_EVIDENCE_ROOT/<candidate sha>/candidate-files (the release files and SHA256SUMS.txt). The job does not
  # build or fetch them. It fails closed when that folder is missing or the files do not match the committed sums.
  checksums:
    name: verify candidate release files
    runs-on: [self-hosted, linux, x64, joy-media-ci]
    needs: [validate-candidate]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Verify the candidate file list against the committed sums
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'candidate_sha must be a full lowercase commit SHA' >&2; exit 1; }
          evidence_root="${JOY_MEDIA_CI_EVIDENCE_ROOT:-}"
          test -n "$evidence_root" || { echo 'JOY_MEDIA_CI_EVIDENCE_ROOT is required for candidate files' >&2; exit 1; }
          candidate_files_dir="$evidence_root/$CANDIDATE_SHA/candidate-files"
          committed_sums="docs/release/attended/$CANDIDATE_SHA/SHA256SUMS.txt"
          test -d "$candidate_files_dir" || { echo "candidate files are missing from the evidence store: $candidate_files_dir" >&2; exit 1; }
          test -s "$committed_sums" || { echo "committed candidate checksums are missing: $committed_sums" >&2; exit 1; }
          node --experimental-strip-types tooling/release/src/checksums.ts verify --dir "$candidate_files_dir"
          cmp "$candidate_files_dir/SHA256SUMS.txt" "$committed_sums"
          test -s "$candidate_files_dir/joy-media-setup.exe"

  # Windows is not run here: the attended and Sandbox receipts are read from the dispatch checkout. The local-only release gate
  # then evaluates the candidate with its real inputs (builds, tests, static checks, receipts). The dispatch checkout holds the
  # receipts, which are committed after the candidate, so the gate binds the candidate with --candidate= and allows only
  # receipt and release-tooling changes after it (gate.ts resolveAttendedCandidate).
  windows-candidate:
    name: attended and Sandbox receipts plus the local release gate (Linux)
    runs-on: [self-hosted, linux, x64, joy-media-ci]
    needs: [validate-candidate, checksums]
    # The gate runs typecheck, lint, format, the full Vitest suite, the editor and Worker builds and the goldens.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Verify the dispatch checkout and pinned pnpm
        shell: bash
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'candidate_sha must be a full lowercase commit SHA' >&2; exit 1; }
          node --version
          corepack enable pnpm
          test "$(pnpm --version)" = '11.15.0'
      - name: Stage and verify candidate files from the local evidence store
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'candidate_sha must be a full lowercase commit SHA' >&2; exit 1; }
          candidate_files_dir="${JOY_MEDIA_CI_EVIDENCE_ROOT:?candidate files require a local evidence store}/$CANDIDATE_SHA/candidate-files"
          committed_sums="docs/release/attended/$CANDIDATE_SHA/SHA256SUMS.txt"
          release_dir="apps/desktop/dist/releases"
          test -d "$candidate_files_dir" || { echo "candidate files are missing from the evidence store: $candidate_files_dir" >&2; exit 1; }
          test ! -e "$release_dir" || { echo "candidate staging directory already exists: $release_dir" >&2; exit 1; }
          mkdir -p "$release_dir"
          cp -a "$candidate_files_dir/." "$release_dir/"
          node --experimental-strip-types tooling/release/src/checksums.ts verify --dir "$release_dir"
          cmp "$release_dir/SHA256SUMS.txt" "$committed_sums"
          test -s "$release_dir/joy-media-setup.exe"
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Run the local release gate on the candidate (this step fails when the gate exits non-zero)
        shell: bash
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'candidate_sha must be a full lowercase commit SHA' >&2; exit 1; }
          pnpm release:gate:local --candidate="$CANDIDATE_SHA"
      - name: Print the gate report (a waived Sandbox lifecycle is listed as WAIVED, never passed)
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          report='test-output/release-gate/report.json'
          if [ ! -s "$report" ]; then echo 'the release gate wrote no report' >&2; exit 0; fi
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const { result } = JSON.parse(readFileSync('test-output/release-gate/report.json', 'utf8'));
          console.log('release gate passed: ' + result.passed);
          for (const check of result.checks) {
            console.log(check.status.toUpperCase() + ' ' + check.id + ': ' + check.message);
          }
          NODE

  offline-packaged-smoke:
    name: validate committed offline packaged smoke receipt
    runs-on: [self-hosted, linux, x64, joy-media-ci]
    needs: [validate-candidate, checksums]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Validate the committed joy-media.offline-smoke/1 receipt
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'candidate_sha must be a full lowercase commit SHA' >&2; exit 1; }
          window_start="$(git show -s --format=%cI "$CANDIDATE_SHA")"
          window_end="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          node --experimental-strip-types tooling/release/src/check-offline-smoke.ts --candidate "$CANDIDATE_SHA" --receipt "docs/release/attended/$CANDIDATE_SHA/offline-smoke.json" --sums "docs/release/attended/$CANDIDATE_SHA/SHA256SUMS.txt" --artifact joy-media-setup.exe --window-start "$window_start" --window-end "$window_end"
  fixture-acceptance:
    name: fixture-acceptance (desktop-primary suite and production bundle smoke, one build)
    runs-on: [self-hosted, linux, x64, joy-media-acceptance]
    needs: [validate-candidate]
    if: ${{ always() && needs.validate-candidate.result == 'success' }}
    timeout-minutes: 60
    env:
      JOY_MEDIA_CI_ACCEPTANCE_PROFILE: fixture-only
      JOY_MEDIA_CI_ACCEPTANCE_WORKER: ''
      JOY_MEDIA_CI_REAL_ACCEPTANCE_COMMAND: ''
      JOY_MEDIA_CI_EVIDENCE_ROOT: ''
      JOY_MEDIA_CI_DATABASE_URL: ''
      JOY_MEDIA_CI_S3_ENDPOINT: ''
      JOY_MEDIA_CI_S3_ACCESS_KEY: ''
      JOY_MEDIA_CI_S3_SECRET_KEY: ''
      JOY_MEDIA_CI_S3_SECRET_ACCESS_KEY: ''
      JOY_MEDIA_CI_S3_HEALTHCHECK_URL: ''
      JOY_MEDIA_OPENCLI_PROFILE: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Verify fixture-only acceptance boundary and pinned pnpm
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'candidate_sha must be a full lowercase commit SHA' >&2; exit 1; }
          test "${JOY_MEDIA_CI_ACCEPTANCE_PROFILE:-}" = 'fixture-only' || { echo 'JOY_MEDIA_CI_ACCEPTANCE_PROFILE=fixture-only is required' >&2; exit 1; }
          node --version
          corepack enable pnpm
          test "$(pnpm --version)" = '11.15.0'
          test -z "${JOY_MEDIA_OPENCLI_PROFILE:-}" || { echo 'OpenCLI profiles are forbidden on acceptance runners' >&2; exit 1; }
          test -z "${JOY_MEDIA_CI_DATABASE_URL:-}" || { echo 'fixture-only acceptance must not receive the runner database URL' >&2; exit 1; }
          test -z "${JOY_MEDIA_CI_S3_ACCESS_KEY:-}${JOY_MEDIA_CI_S3_SECRET_KEY:-}${JOY_MEDIA_CI_S3_SECRET_ACCESS_KEY:-}" || { echo 'fixture-only acceptance must not receive runner object-storage credentials' >&2; exit 1; }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Run the CLI humanized render benchmark
        run: pnpm exec vitest run --retry=0 apps/cli/src/humanized/render-benchmark.e2e.test.ts
      - run: pnpm exec playwright install chromium
      - name: Full disposable desktop acceptance suite (reference viewport)
        shell: bash
        env:
          CI: true
          PLAYWRIGHT_WORKERS: 2
          PLAYWRIGHT_HTML_REPORT: ${{ runner.temp }}/joy-media-pw-report-primary-1-${{ github.run_id }}-${{ github.run_attempt }}
          PLAYWRIGHT_TEST_RESULTS_DIR: ${{ runner.temp }}/joy-media-pw-results-primary-1-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          # Exclude the P3 shipping-export matrix spec from *discovery* (not just filtering). --grep-invert runs after Playwright
          # imports the spec, which is too late: the spec's top-level imports of tests/e2e/helpers/p3-export-observer.mjs trigger a
          # Vitest "Cannot require() ES Module ... in a cycle" error during module load. That spec only runs safely inside the
          # dedicated JOY_MEDIA_CI_LANE_MODE=p3 lane; everywhere else we must keep it out of the loader entirely. Building an
          # explicit positional argument list keeps every other desktop-primary test and prevents the excluded module from being
          # imported at all.
          desktop_specs=()
          for spec in tests/e2e/*.spec.ts; do
            case "$(basename "$spec")" in
              r2-p3-shipping-export-acceptance.spec.ts) continue ;;
            esac
            desktop_specs+=("$spec")
          done
          if [ "${#desktop_specs[@]}" -eq 0 ]; then
            echo "::error::no acceptance specs remained after excluding r2-p3-shipping-export-acceptance.spec.ts" >&2
            exit 1
          fi
          pnpm exec playwright test --retries=0 "${desktop_specs[@]}" --project=desktop-primary --workers=2
      - name: Measure the shipped editor entry-bundle graph
        shell: bash
        run: |
          set -euo pipefail
          # The soak's initialEditorJsBytes budget measures the DEV entry module (/src/main.tsx) in the real-service lane and does
          # not substantiate production bundle size. Measure the real artifact here: dist/index.html entry chunk + its
          # modulepreload graph, raw AND gzip. Budgets are generous (a real regression, not noise) and the numbers are evidence.
          node tooling/release/measure-entry-bundle.mjs \
            apps/editor-web/dist \
            test-output/prod-build/entry-bundle.json
          test -s test-output/prod-build/entry-bundle.json
      - name: Smoke the production bundle through the app's public UI
        shell: bash
        env:
          CI: true
          PLAYWRIGHT_WORKERS: 1
          PW_PID_DIR: ${{ runner.temp }}/joy-media-prodsmoke-pids-${{ github.run_id }}-${{ github.run_attempt }}
          PLAYWRIGHT_HTML_REPORT: ${{ runner.temp }}/joy-media-pw-report-prodsmoke-${{ github.run_id }}-${{ github.run_attempt }}
          PLAYWRIGHT_TEST_RESULTS_DIR: ${{ runner.temp }}/joy-media-pw-results-prodsmoke-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          mkdir -p "$PW_PID_DIR"
          # Run-scoped ports (not fixed 4990/4991 — this lane shares the joy-media-acceptance label with the real-service and P3
          # lanes, and two gate runs, or a v1 run, must not collide). --strictPort so a genuine clash fails loud.
          api_port=$(( 21000 + (GITHUB_RUN_ID % 3000) ))
          web_port=$(( api_port + 5000 ))
          export JOY_MEDIA_E2E_API_PORT="$api_port"
          export JOY_MEDIA_E2E_API_URL="http://127.0.0.1:${api_port}"
          export PLAYWRIGHT_BASE_URL="http://127.0.0.1:${web_port}"
          # Each server is its own process group (setsid) so teardown can signal the whole tree by pgid — no `pkill -f` sweeping
          # other jobs.
          setsid pnpm --fail-if-no-match --filter @joy-media/test-control-plane exec tsx ../../tooling/e2e-server.ts >"$PW_PID_DIR/api.log" 2>&1 &
          echo $! > "$PW_PID_DIR/api.pid"
          setsid pnpm --filter @joy-media/editor-web exec vite preview --host 127.0.0.1 --port "$web_port" --strictPort >"$PW_PID_DIR/web.log" 2>&1 &
          echo $! > "$PW_PID_DIR/web.pid"
          for i in $(seq 1 60); do curl -fsS "http://127.0.0.1:${api_port}/health" >/dev/null 2>&1 && break; sleep 1; done
          if ! curl -fsS "http://127.0.0.1:${api_port}/health" >/dev/null; then cat "$PW_PID_DIR/api.log" >&2; exit 1; fi
          for i in $(seq 1 45); do curl -fsS "http://127.0.0.1:${web_port}/" >/dev/null 2>&1 && break; sleep 1; done
          if ! curl -fsS "http://127.0.0.1:${web_port}/" >/dev/null; then cat "$PW_PID_DIR/web.log" >&2; exit 1; fi
          # Serve the *production* editor bundle (vite preview of dist/, mirrored /api proxy) + the isolated e2e API; run the
          # UI-journey specs that exercise import, decode/seek and the encode/export Worker path against the shipped artifact. The
          # dev-server-only white-box decoder specs stay in the desktop-primary and real-service lanes.
          pnpm exec playwright test --retries=0 \
            tests/e2e/wp32-real-project-journey.spec.ts \
            tests/e2e/wp30-animated-timeline-export.spec.ts \
            tests/e2e/golden-path.spec.ts \
            --project=desktop-primary --workers=1
      - name: Verify fixture-acceptance teardown
        if: always()
        shell: bash
        env:
          PW_PID_DIR: ${{ runner.temp }}/joy-media-prodsmoke-pids-${{ github.run_id }}-${{ github.run_attempt }}
          PLAYWRIGHT_HTML_REPORT: ${{ runner.temp }}/joy-media-pw-report-prodsmoke-${{ github.run_id }}-${{ github.run_attempt }}
          PLAYWRIGHT_TEST_RESULTS_DIR: ${{ runner.temp }}/joy-media-pw-results-prodsmoke-${{ github.run_id }}-${{ github.run_attempt }}
          PRIMARY_HTML_REPORT: ${{ runner.temp }}/joy-media-pw-report-primary-1-${{ github.run_id }}-${{ github.run_attempt }}
          PRIMARY_RESULTS_DIR: ${{ runner.temp }}/joy-media-pw-results-primary-1-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          alive() { kill -0 "$1" 2>/dev/null; }
          for name in api web; do
            pid_file="$PW_PID_DIR/$name.pid"
            [ -s "$pid_file" ] || continue
            pid=$(cat "$pid_file")
            kill -TERM -"$pid" 2>/dev/null || kill -TERM "$pid" 2>/dev/null || true
            for i in $(seq 1 15); do alive "$pid" || break; sleep 1; done
            if alive "$pid"; then kill -KILL -"$pid" 2>/dev/null || kill -KILL "$pid" 2>/dev/null || true; sleep 2; fi
            alive "$pid" && { echo "fixture smoke $name server $pid survived teardown" >&2; exit 1; } || true
          done
          # Both suites' outputs are run-owned and must be removed inside RUNNER_TEMP, with bounded retries.
          for output_path in "$PLAYWRIGHT_HTML_REPORT" "$PLAYWRIGHT_TEST_RESULTS_DIR" "$PW_PID_DIR" "$PRIMARY_HTML_REPORT" "$PRIMARY_RESULTS_DIR"; do
            case "$output_path" in
              "$RUNNER_TEMP"/*) ;;
              *) echo "refusing to clean output outside RUNNER_TEMP: $output_path" >&2; exit 1 ;;
            esac
            removed=0
            for attempt in $(seq 1 15); do
              if rm -rf -- "$output_path" 2>/dev/null && test ! -e "$output_path"; then removed=1; break; fi
              sleep 1
            done
            test "$removed" -eq 1 || { echo "unable to remove run-owned output after bounded retries: $output_path" >&2; exit 1; }
          done
          test -z "$(git status --porcelain)"

  acceptance-responsive:
    name: acceptance-responsive 6 viewports (single pass)
    runs-on: [self-hosted, linux, x64, joy-media-ci]
    needs: [validate-candidate]
    timeout-minutes: 20
    env:
      JOY_MEDIA_CI_ACCEPTANCE_PROFILE: fixture-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Verify fixture-only acceptance boundary
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'candidate_sha must be a full lowercase commit SHA' >&2; exit 1; }
          test "${JOY_MEDIA_CI_ACCEPTANCE_PROFILE:-}" = 'fixture-only' || { echo 'JOY_MEDIA_CI_ACCEPTANCE_PROFILE=fixture-only is required' >&2; exit 1; }
          node --version
          corepack enable pnpm
          pnpm --version
          test -z "${JOY_MEDIA_OPENCLI_PROFILE:-}" || { echo 'OpenCLI profiles are forbidden on acceptance runners' >&2; exit 1; }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec playwright install chromium
      - name: Layout / overflow / a11y / panel-reachability at every non-primary viewport
        shell: bash
        env:
          CI: true
          PLAYWRIGHT_WORKERS: 1
          PLAYWRIGHT_HTML_REPORT: ${{ runner.temp }}/joy-media-pw-report-responsive-1-${{ github.run_id }}-${{ github.run_attempt }}
          PLAYWRIGHT_TEST_RESULTS_DIR: ${{ runner.temp }}/joy-media-pw-results-responsive-1-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          # Per-viewport: wp32 panel-reachability + per-panel overflow; golden-path first-screen overflow + axe scan; wp35
          # loaded-timeline transport/workspace geometry. --grep unions the three, then assert-playwright-titles verifies each of
          # the 3 EXACT test titles ran and passed at that viewport (identity, not just a count).
          grep_re='(keeps project controls, workspace navigation|first screen loads without fatal|renders professional track codes, mixed elements)'
          req_titles=(
            'keeps project controls, workspace navigation, and keyboard menus reachable'
            'first screen loads without fatal browser errors or horizontal overflow'
            'renders professional track codes, mixed elements, and Quarter preview controls'
          )
          for profile in desktop-compact desktop-minimum desktop-1280 desktop-1440 desktop-1581 desktop-1920; do
            echo "::group::responsive checkpoints @ $profile"
            # Report name unique to run/attempt/pass/profile; deleted before the run so a stale file can never satisfy the identity check.
            rj="$RUNNER_TEMP/pw-responsive-1-$profile-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.json"
            rm -f "$rj"
            PLAYWRIGHT_JSON_OUTPUT_NAME="$rj" pnpm exec playwright test --retries=0 \
              tests/e2e/wp32-responsive-checkpoints.spec.ts \
              tests/e2e/golden-path.spec.ts \
              tests/e2e/wp35-universal-timeline.spec.ts \
              --grep "$grep_re" --project="$profile" --workers=1 --reporter=json,line
            test -s "$rj" || { echo "no Playwright JSON report produced for $profile" >&2; exit 1; }
            node tooling/release/assert-playwright-titles.mjs "$rj" "${req_titles[@]}"
            rm -f "$rj"
            echo "::endgroup::"
          done
      - name: Verify acceptance teardown
        if: always()
        shell: bash
        env:
          PLAYWRIGHT_HTML_REPORT: ${{ runner.temp }}/joy-media-pw-report-responsive-1-${{ github.run_id }}-${{ github.run_attempt }}
          PLAYWRIGHT_TEST_RESULTS_DIR: ${{ runner.temp }}/joy-media-pw-results-responsive-1-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          for output_path in "$PLAYWRIGHT_HTML_REPORT" "$PLAYWRIGHT_TEST_RESULTS_DIR"; do
            case "$output_path" in
              "$RUNNER_TEMP"/*) ;;
              *) echo "refusing to clean output outside RUNNER_TEMP: $output_path" >&2; exit 1 ;;
            esac
            removed=0
            for attempt in $(seq 1 15); do
              if rm -rf -- "$output_path" 2>/dev/null && test ! -e "$output_path"; then removed=1; break; fi
              sleep 1
            done
            test "$removed" -eq 1 || { echo "unable to remove run-owned output after bounded retries: $output_path" >&2; exit 1; }
          done
          test -z "$(git status --porcelain)"

  site-build:
    name: static site build and tests
    runs-on: [self-hosted, linux, x64, joy-media-ci]
    needs: [validate-candidate]
    timeout-minutes: 30
    env:
      CI: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Verify candidate toolchain
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          node --version
          corepack enable pnpm
          test "$(pnpm --version)" = '11.15.0'
      - run: pnpm install --frozen-lockfile
      - name: Build the static site
        run: pnpm --filter @joy-media/site build
      - name: Run static site tests
        run: pnpm exec vitest run --retry=0 apps/site
      - run: pnpm exec playwright install chromium
      - name: Run static site browser checks
        run: pnpm exec playwright test --retries=0 --config playwright.site.config.ts

  gate-summary:
    name: gate-summary
    runs-on: [self-hosted, linux, x64, joy-media-ci]
    needs:
      [
        validate-candidate,
        hosted-verify,
        node-contracts,
        editor-web-bundle,
        windows-candidate,
        checksums,
        offline-packaged-smoke,
        fixture-acceptance,
        acceptance-responsive,
        site-build,
      ]
    if: always()
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - name: Require every candidate lane to pass
        shell: bash
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          node --experimental-strip-types tooling/release/src/ci-gate-summary.ts "$NEEDS_JSON" 'validate-candidate,hosted-verify,node-contracts,editor-web-bundle,windows-candidate,checksums,offline-packaged-smoke,fixture-acceptance,acceptance-responsive,site-build'
