name: ci-dev

# DEVELOPMENT VERIFICATION — NOT a release approval.
#
# Hosted developer gate for pull requests and pushes to main, plus manual
# dispatch. It runs static checks, the full unit/integration suite, the Worker
# package self-test, the full browser suite, and responsive checkpoints. It does
# NOT run the real-service acceptance lane, the effects soak, or the encoded
# real-export delivery journey. This workflow is NOT a release approval.
#
# Affected-test selection is deliberately NOT used: any change to shared
# runtime / controller / schema / render / CI config runs the whole set below.
#
# RUNNER POLICY: all jobs use GitHub-hosted runners. Pull request code runs
# without secrets, and the workflow requests only contents: read permission.
# The contract is enforced offline by tooling/release/src/ci-runner-policy.test.ts.
#
# TRIGGERS: pull requests targeting main, pushes to main, and workflow_dispatch.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-dev-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static-and-unit:
    name: static + unit/integration (development verification)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Verify runner toolchain
        shell: bash
        run: |
          set -euo pipefail
          node --version
          corepack enable pnpm
          pnpm --version
          if ! ffmpeg -version; then echo 'ffmpeg is missing or unavailable on ubuntu-24.04' >&2; exit 1; fi
          if ! ffprobe -version; then echo 'ffprobe is missing or unavailable on ubuntu-24.04' >&2; exit 1; fi
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium and verify its executable
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec playwright install --with-deps chromium
          chromium_path="$(node -e "process.stdout.write(require('@playwright/test').chromium.executablePath())")"
          test -x "$chromium_path" || { echo 'Locked Playwright Chromium executable is missing' >&2; exit 1; }
          echo "JOY_CHROMIUM_PATH=$chromium_path" >> "$GITHUB_ENV"
      - name: verify:ci (format, lint, typecheck, full vitest, build, prod audit)
        run: pnpm run verify:ci
      - name: harness unit tests (cross-platform subset — POSIX cases run on the Linux release gate)
        run: pnpm run test:harness

  worker-package:
    name: Worker package build + self-test (development verification)
    needs: static-and-unit
    # Portable package self-test, not Docker lifecycle evidence.
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Verify runner toolchain
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          node --version
          if ($LASTEXITCODE -ne 0) { throw 'Node 24 is missing or unavailable on windows-2025.' }
          corepack enable pnpm
          if ($LASTEXITCODE -ne 0) { throw 'Corepack could not enable pnpm on windows-2025.' }
          pnpm --version
          if ($LASTEXITCODE -ne 0) { throw 'pnpm is missing or unavailable on windows-2025.' }
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) { throw 'ffmpeg is missing on windows-2025.' }
          ffmpeg -version
          if ($LASTEXITCODE -ne 0) { throw 'ffmpeg failed to run on windows-2025.' }
          if (-not (Get-Command ffprobe -ErrorAction SilentlyContinue)) { throw 'ffprobe is missing on windows-2025.' }
          ffprobe -version
          if ($LASTEXITCODE -ne 0) { throw 'ffprobe failed to run on windows-2025.' }
      - run: pnpm install --frozen-lockfile
        shell: powershell
      - name: Build Worker and package self-test executable
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          pnpm --filter @joy-media/worker build
          $output = Join-Path $env:RUNNER_TEMP ("joy-worker-" + $env:GITHUB_SHA + "-" + $env:GITHUB_RUN_ID + "-" + $env:GITHUB_RUN_ATTEMPT + ".exe")
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/build-worker-exe.ps1 -OutputPath $output
          if (-not (Test-Path -LiteralPath $output -PathType Leaf)) { throw 'Worker executable was not produced.' }
          $result = & $output --joy-worker-self-test
          if ($LASTEXITCODE -ne 0 -or $result -notmatch '"ok"\s*:\s*true') { throw 'Worker executable self-test failed.' }

  browser:
    name: browser suite (development verification) — ${{ matrix.label }}
    needs: static-and-unit
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: desktop-primary full
            project: desktop-primary
            spec: tests/e2e
            workers: '2'
            api_port: 4174
            web_port: 4173
          - label: desktop-compact responsive
            project: desktop-compact
            spec: tests/e2e/wp32-responsive-checkpoints.spec.ts
            workers: '1'
            api_port: 4274
            web_port: 4273
          - label: desktop-minimum responsive
            project: desktop-minimum
            spec: tests/e2e/wp32-responsive-checkpoints.spec.ts
            workers: '1'
            api_port: 4374
            web_port: 4373
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CI: true
      PLAYWRIGHT_WORKERS: ${{ matrix.workers }}
      JOY_MEDIA_E2E_API_PORT: ${{ matrix.api_port }}
      JOY_MEDIA_E2E_WEB_PORT: ${{ matrix.web_port }}
      JOY_MEDIA_E2E_API_URL: http://127.0.0.1:${{ matrix.api_port }}
      # RUNNER_TEMP, not the checkout — the release lanes' pattern. A relative
      # path here would be an unignored, uncleaned dir on a persistent runner.
    steps:
      # runner.temp is not available in job-level env; set the paths here.
      - name: Set Playwright output paths
        shell: bash
        run: |
          echo "PLAYWRIGHT_HTML_REPORT=$RUNNER_TEMP/playwright-report-${{ matrix.project }}-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_ENV"
          echo "PLAYWRIGHT_TEST_RESULTS_DIR=$RUNNER_TEMP/playwright-test-results-${{ matrix.project }}-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Verify runner toolchain
        shell: bash
        run: |
          set -euo pipefail
          node --version
          corepack enable pnpm
          pnpm --version
          if ! ffmpeg -version; then echo 'ffmpeg is missing or unavailable on ubuntu-24.04' >&2; exit 1; fi
          if ! ffprobe -version; then echo 'ffprobe is missing or unavailable on ubuntu-24.04' >&2; exit 1; fi
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - name: Run browser audit (${{ matrix.label }})
        run: pnpm exec playwright test ${{ matrix.spec }} --project=${{ matrix.project }} --workers=${{ matrix.workers }}
      - name: Verify no checkout residue
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          for output_path in "$PLAYWRIGHT_HTML_REPORT" "$PLAYWRIGHT_TEST_RESULTS_DIR"; do
            case "$output_path" in
              "$RUNNER_TEMP"/*) ;;
              *) echo "refusing to clean output outside RUNNER_TEMP: $output_path" >&2; exit 1 ;;
            esac
            rm -rf -- "$output_path" 2>/dev/null || true
          done
          if (( $(git status --porcelain | wc -l) != 0 )); then git status --porcelain; throw 'browser audit left residue in the checkout'; fi

  development-verification-summary:
    name: development verification summary (NOT release approval)
    needs: [static-and-unit, browser, worker-package]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Require every development lane green
        shell: bash
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          # Structured, name-keyed evaluation (shared with release-candidate-v2).
          node --experimental-strip-types tooling/release/src/ci-gate-summary.ts "$NEEDS_JSON" \
            'static-and-unit,browser,worker-package'
          echo 'development verification passed — this is NOT a release approval'
