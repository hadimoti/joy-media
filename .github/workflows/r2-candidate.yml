name: r2-candidate

# GitHub-hosted release-candidate gate for JOY Live Director R2 ("Living Looks").
#
# This is the older S-shaped gate whose design allowed the workshop PC to be
# powered down while the gate ran. Under the JOY-Media self-hosted-only CI
# architecture (Iran cannot purchase GitHub-hosted minutes/billing), it MUST
# run on the owner-controlled PC Docker self-hosted runner set:
#
#   - Linux lanes (validate-candidate, verify, acceptance,
#     real-service-acceptance, r2-gate-summary): the
#     joy-media-ci Linux Docker container
#     (`self-hosted,linux,x64,joy-media-ci`).
#   - windows-worker-clean (joy-worker.exe build + Windows-only
#     self-test against a loopback control-plane fixture):
#     the dedicated Windows Worker runner
#     (`self-hosted,windows,x64,joy-media-worker-docker`).
#
# No job uses `ubuntu-latest`, `windows-latest`, `macos-latest`, or any
# other GitHub-hosted label. The contract is enforced offline by
# tooling/release/src/ci-runner-policy.test.ts. Every job checks out the
# exact immutable CANDIDATE_SHA, and every lane runs twice.
#
# NOTE on the previous `ubuntu-latest` / `windows-latest` host: those
# hosted labels are unavailable to this account. Any future regression
# that re-adds a hosted label will fail the runner-policy test before
# any CI minute is consumed.

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Full 40-character commit SHA to verify (must already be pushed to this repository)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: r2-candidate-${{ inputs.candidate_sha }}
  cancel-in-progress: false

env:
  CANDIDATE_SHA: ${{ inputs.candidate_sha }}
  NODE_VERSION: '22'

jobs:
  validate-candidate:
    name: validate-candidate
    runs-on: [self-hosted, linux, x64, joy-media-ci]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - name: Validate immutable candidate input
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'candidate_sha must be a full lowercase commit SHA' >&2; exit 1; }
          resolved_sha="$(git rev-parse HEAD)"
          [[ "$resolved_sha" == "$CANDIDATE_SHA" ]] || { echo 'candidate_sha is not reachable from this repository' >&2; exit 1; }

  verify:
    name: verify (pass ${{ matrix.pass }})
    runs-on: [self-hosted, linux, x64, joy-media-ci]
    needs: [validate-candidate]
    strategy:
      fail-fast: false
      matrix:
        pass: [1, 2]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - name: Prepare toolchain
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'candidate_sha must be a full lowercase commit SHA' >&2; exit 1; }
          corepack enable
          corepack prepare pnpm@11.15.0 --activate
          node --version
          pnpm --version
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
      - run: pnpm install --frozen-lockfile
      - name: Full source gate (typecheck + lint + format + unit + build + prod audit)
        run: pnpm run verify:ci
      - name: Verify no untracked residue
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"

  worker-package:
    name: worker-package (pass ${{ matrix.pass }})
    # Windows self-hosted runner on the owner's PC. Required because
    # joy-worker.exe uses Node SEA + postject + PowerShell + Win32 process
    # APIs that no Linux container can satisfy. NOT `windows-latest` (which
    # would consume GitHub-hosted minutes and is unavailable from Iran).
    # The only Windows acceptance evidence in this workflow is produced here
    # on the self-hosted Windows worker — see docs/SELF-HOSTED-CI.md
    # §Windows-platform evidence for the honest Windows-platform caveat.
    runs-on: [self-hosted, windows, x64, joy-media-worker-docker]
    needs: [validate-candidate]
    strategy:
      fail-fast: false
      matrix:
        pass: [1, 2]
    timeout-minutes: 60
    outputs:
      evidence1: ${{ steps.publish-evidence.outputs.evidence1 }}
      evidence2: ${{ steps.publish-evidence.outputs.evidence2 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - name: Prepare toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:CANDIDATE_SHA -notmatch '^[0-9a-f]{40}$') { throw 'candidate_sha must be a full lowercase commit SHA' }
          corepack enable
          corepack prepare pnpm@11.15.0 --activate
          node --version
          pnpm --version
          ffmpeg -version | Select-Object -First 1
          ffprobe -version | Select-Object -First 1
      - run: pnpm install --frozen-lockfile
      - name: Build Worker and run two exact self-test passes
        id: build-worker
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          pnpm --filter @joy-media/worker build
          $results = @{}
          foreach ($pass in @('1', '2')) {
            $output = Join-Path $env:RUNNER_TEMP ("joy-worker-" + $env:CANDIDATE_SHA + "-" + $env:GITHUB_RUN_ID + "-" + $env:GITHUB_RUN_ATTEMPT + "-" + $pass + ".exe")
            powershell -NoProfile -ExecutionPolicy Bypass -File scripts/build-worker-exe.ps1 -OutputPath $output
            if (-not (Test-Path -LiteralPath $output -PathType Leaf)) { throw "Worker executable was not produced for pass $pass." }
            $result = & $output --joy-worker-self-test
            if ($LASTEXITCODE -ne 0 -or $result -notmatch '"ok"\s*:\s*true') { throw "Worker executable self-test failed for pass $pass." }
            $evidence = [ordered]@{
              schemaVersion = 1
              status        = 'verified'
              # Explicit execution label: this is Windows evidence from the
              # owner-controlled self-hosted Windows runner, NOT from a
              # GitHub-hosted Windows VM. See docs/SELF-HOSTED-CI.md
              # §Windows-platform evidence for the explicit caveat.
              execution     = 'windows-docker-container'
              runner        = 'self-hosted,windows,x64,joy-media-worker-docker'
              candidateSha  = $env:CANDIDATE_SHA
              workflowRunId = $env:GITHUB_RUN_ID
              attempt       = $env:GITHUB_RUN_ATTEMPT
              lanePass      = [int]$pass
              worker        = @{ selfTest = 'ok'; producer = 'build-worker-exe' }
              verifiedAt    = (Get-Date).ToUniversalTime().ToString('o')
            } | ConvertTo-Json -Depth 6
            $results[$pass] = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($evidence))
          }
          Set-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'joy-media-windows-acceptance-outputs.json') -Value ($results | ConvertTo-Json) -Encoding utf8
      - name: Publish Windows Worker acceptance outputs
        id: publish-evidence
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $results = Get-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'joy-media-windows-acceptance-outputs.json') -Raw | ConvertFrom-Json
          [IO.File]::AppendAllText($env:GITHUB_OUTPUT, "evidence1=$($results.'1')$([Environment]::NewLine)")
          [IO.File]::AppendAllText($env:GITHUB_OUTPUT, "evidence2=$($results.'2')$([Environment]::NewLine)"

  acceptance:
    name: acceptance ${{ matrix.profile }} (pass ${{ matrix.pass }})
    runs-on: [self-hosted, linux, x64, joy-media-ci]
    needs: [validate-candidate, verify, worker-package]
    strategy:
      fail-fast: false
      matrix:
        pass: [1, 2]
        profile:
          [
            desktop-primary,
            desktop-compact,
            desktop-minimum,
            desktop-1280,
            desktop-1440,
            desktop-1581,
            desktop-1920,
          ]
    timeout-minutes: 75
    env:
      CI: 'true'
      PLAYWRIGHT_WORKERS: '1'
      JOY_MEDIA_CI_ACCEPTANCE_PROFILE: fixture-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - name: Prepare toolchain
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'candidate_sha must be a full lowercase commit SHA' >&2; exit 1; }
          corepack enable
          corepack prepare pnpm@11.15.0 --activate
          ffmpeg -version | head -n 1
          {
            echo "PLAYWRIGHT_HTML_REPORT=$RUNNER_TEMP/pw-report-${{ matrix.profile }}-${{ matrix.pass }}"
            echo "PLAYWRIGHT_TEST_RESULTS_DIR=$RUNNER_TEMP/pw-results-${{ matrix.profile }}-${{ matrix.pass }}"
          } >> "$GITHUB_ENV"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - name: Disposable desktop acceptance journeys
        run: pnpm exec playwright test tests/e2e --project=${{ matrix.profile }} --workers=1
      - name: Verify acceptance teardown
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          for output_path in "$PLAYWRIGHT_HTML_REPORT" "$PLAYWRIGHT_TEST_RESULTS_DIR"; do
            case "$output_path" in
              "$RUNNER_TEMP"/*) ;;
              *) echo "refusing to clean output outside RUNNER_TEMP: $output_path" >&2; exit 1 ;;
            esac
            rm -rf -- "$output_path" 2>/dev/null || true
          done
          test -z "$(git status --porcelain)"

  real-service-acceptance:
    name: real-service-acceptance (pass ${{ matrix.pass }})
    runs-on: [self-hosted, linux, x64, joy-media-ci]
    needs: [validate-candidate, acceptance, worker-package]
    strategy:
      fail-fast: false
      matrix:
        pass: [1, 2]
    timeout-minutes: 120
    env:
      CI: 'true'
      JOY_MEDIA_CI_ACCEPTANCE_PROFILE: real-services
      JOY_MEDIA_CI_ACCEPTANCE_WORKER: disposable
      JOY_MEDIA_CI_DATABASE_URL: postgresql://joy:joy@localhost:5432/joymedia_ci
      JOY_MEDIA_CI_S3_ENDPOINT: http://joyminio:joyminio-secret@localhost:9000
      JOY_MEDIA_CI_S3_ACCESS_KEY: joyminio
      JOY_MEDIA_CI_S3_SECRET_KEY: joyminio-secret
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - name: Prepare toolchain and MinIO client
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'candidate_sha must be a full lowercase commit SHA' >&2; exit 1; }
          corepack enable
          corepack prepare pnpm@11.15.0 --activate
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
          # MinIO client `mc` is pre-installed in the joy-media-ci Linux Docker
          # image (see ops/self-hosted/linux-runner/Dockerfile).
          mc --version
          # PostgreSQL/MinIO namespaces are provisioned by the runner-local
          # JOY_MEDIA_CI_RELEASE_COMMAND; the runner is expected to publish
          # JOY_MEDIA_CI_DATABASE_URL and JOY_MEDIA_CI_S3_HEALTHCHECK_URL.
          test -n "${JOY_MEDIA_CI_DATABASE_URL:-}" || { echo 'JOY_MEDIA_CI_DATABASE_URL is required on this isolated runner' >&2; exit 1; }
          pg_isready --dbname="$JOY_MEDIA_CI_DATABASE_URL" >/dev/null
          test -n "${JOY_MEDIA_CI_S3_HEALTHCHECK_URL:-}" || { echo 'JOY_MEDIA_CI_S3_HEALTHCHECK_URL is required on this isolated runner' >&2; exit 1; }
          curl --fail --silent --show-error "$JOY_MEDIA_CI_S3_HEALTHCHECK_URL" >/dev/null
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - name: Bind Windows Worker evidence to the gate contract
        env:
          WINDOWS_EVIDENCE_1_B64: ${{ needs.worker-package.outputs.evidence1 }}
          WINDOWS_EVIDENCE_2_B64: ${{ needs.worker-package.outputs.evidence2 }}
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.pass }}" in
            1) WINDOWS_EVIDENCE_B64="${WINDOWS_EVIDENCE_1_B64:-}" ;;
            2) WINDOWS_EVIDENCE_B64="${WINDOWS_EVIDENCE_2_B64:-}" ;;
            *) echo "unexpected real-service pass: ${{ matrix.pass }}" >&2; exit 1 ;;
          esac
          test -n "${WINDOWS_EVIDENCE_B64:-}" || { echo 'Windows Worker acceptance output is missing for this pass' >&2; exit 1; }
          mkdir -p test-output/windows
          printf '%s' "$WINDOWS_EVIDENCE_B64" | base64 --decode > test-output/windows/acceptance.json
          test -s test-output/windows/acceptance.json
          # Honest Windows-platform caveat: the upstream worker-package job ran
          # on the owner-controlled self-hosted Windows runner (NOT a
          # GitHub-hosted Windows VM). Record the runner label inline with the
          # evidence so the durable store never misrepresents a Linux
          # container run as Windows acceptance.
          node -e '
            const fs = require("node:fs");
            const path = "test-output/windows/acceptance.json";
            const r = JSON.parse(fs.readFileSync(path, "utf8"));
            r.windowsRunner = "self-hosted,windows,x64,joy-media-worker-docker";
            r.hostedProvider = "self-hosted (owner-controlled Docker Desktop)";
            fs.writeFileSync(path, JSON.stringify(r, null, 2));
          '
      - name: Authenticated real-service desktop acceptance and evidence
        run: |
          set -euo pipefail
          bash ops/self-hosted/linux-runner/real-service-acceptance.sh \
            "$CANDIDATE_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "${{ matrix.pass }}"
          for required in \
            test-output/browser/journeys.json \
            test-output/release-performance/polling.json \
            test-output/release-performance/effects-soak.json \
            test-output/release-performance/timeline-integrity.json \
            test-output/release-performance/editor.json \
            test-output/delivery/result.json \
            test-output/windows/acceptance.json \
            test-output/operations/restore.json; do
            test -s "$required" || { echo "required real-service evidence is missing: $required" >&2; exit 1; }
          done
      - name: Evaluate source-bound release gate
        env:
          JOY_RELEASE_OUTPUT: ${{ runner.temp }}/joy-media-release-gate-${{ matrix.pass }}
        run: pnpm run release:gate
      - name: Verify real-service acceptance teardown
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -z "${JOY_MEDIA_OPENCLI_PROFILE:-}"

  r2-gate-summary:
    name: r2-gate-summary
    runs-on: [self-hosted, linux, x64, joy-media-ci]
    needs: [verify, worker-package, acceptance, real-service-acceptance]
    if: always()
    steps:
      - name: Require every lane green
        shell: bash
        run: |
          set -euo pipefail
          fail=0
          for result in \
            "verify=${{ needs.verify.result }}" \
            "worker-package=${{ needs.worker-package.result }}" \
            "acceptance=${{ needs.acceptance.result }}" \
            "real-service-acceptance=${{ needs.real-service-acceptance.result }}"; do
            name="${result%%=*}"
            state="${result##*=}"
            echo "$name: $state"
            [[ "$state" == "success" ]] || fail=1
          done
          [[ "$fail" -eq 0 ]] || { echo 'one or more R2 gate lanes did not pass' >&2; exit 1; }
          echo "R2 candidate $CANDIDATE_SHA: all lanes green x2"
