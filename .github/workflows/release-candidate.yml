name: release-candidate

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Full 40-character commit SHA to verify (must already be reachable from this repository remote)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-candidate-${{ inputs.candidate_sha }}
  cancel-in-progress: false

env:
  CANDIDATE_SHA: ${{ inputs.candidate_sha }}

jobs:
  validate-candidate:
    name: validate-candidate
    runs-on: [self-hosted, linux, x64, joy-media-ci]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - name: Validate immutable candidate input
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'candidate_sha must be a full lowercase commit SHA' >&2; exit 1; }
          resolved_sha="$(git rev-parse HEAD)"
          [[ "$resolved_sha" == "$CANDIDATE_SHA" ]] || { echo 'candidate_sha is not reachable from this repository' >&2; exit 1; }

  linux-real-services:
    name: linux-real-services (pass ${{ matrix.pass }})
    runs-on: [self-hosted, linux, x64, joy-media-ci]
    needs: [validate-candidate]
    strategy:
      fail-fast: false
      matrix:
        pass: [1, 2]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify isolated real-service prerequisites
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'candidate_sha must be a full lowercase commit SHA' >&2; exit 1; }
          node --version
          corepack enable pnpm
          pnpm --version
          command -v psql >/dev/null || { echo 'psql is required on the Linux release runner' >&2; exit 1; }
          command -v pg_isready >/dev/null || { echo 'pg_isready is required on the Linux release runner' >&2; exit 1; }
          test -n "${JOY_MEDIA_CI_DATABASE_URL:-}" || { echo 'JOY_MEDIA_CI_DATABASE_URL is not configured on this isolated runner' >&2; exit 1; }
          pg_isready --dbname="$JOY_MEDIA_CI_DATABASE_URL" >/dev/null
          test -n "${JOY_MEDIA_CI_S3_HEALTHCHECK_URL:-}" || { echo 'JOY_MEDIA_CI_S3_HEALTHCHECK_URL is not configured on this isolated runner' >&2; exit 1; }
          curl --fail --silent --show-error "$JOY_MEDIA_CI_S3_HEALTHCHECK_URL" >/dev/null
      - run: pnpm install --frozen-lockfile
      - name: Run source and real-service gates
        shell: bash
        run: |
          set -euo pipefail
          pnpm run verify:ci
          # The runner's isolated integration harness must exercise its
          # namespaced PostgreSQL/S3 services and teardown contract.
          release_command="${JOY_MEDIA_CI_RELEASE_COMMAND:-}"
          test -x "$release_command" || { echo 'JOY_MEDIA_CI_RELEASE_COMMAND must point to the isolated Linux release harness' >&2; exit 1; }
          "$release_command" "$CANDIDATE_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "${{ matrix.pass }}"
      - name: Verify no untracked teardown residue
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"

  windows-worker-clean:
    name: windows-worker-clean (pass ${{ matrix.pass }})
    runs-on: [self-hosted, windows, x64, joy-media-worker]
    needs: [validate-candidate]
    strategy:
      fail-fast: false
      matrix:
        pass: [1, 2]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify clean Worker host
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:CANDIDATE_SHA -notmatch '^[0-9a-f]{40}$') { throw 'candidate_sha must be a full lowercase commit SHA' }
          node --version
          corepack enable pnpm
          pnpm --version
          ffmpeg -version
          ffprobe -version
          if ($env:JOY_MEDIA_CI_WORKER_PROFILE -ne 'clean') { throw 'JOY_MEDIA_CI_WORKER_PROFILE=clean is required' }
      - run: pnpm install --frozen-lockfile
      - name: Build and self-test Worker package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          pnpm --filter @joy-media/worker build
          $output = Join-Path $env:RUNNER_TEMP ("joy-worker-clean-" + $env:CANDIDATE_SHA + "-" + $env:GITHUB_RUN_ID + "-" + $env:GITHUB_RUN_ATTEMPT + "-" + "${{ matrix.pass }}" + ".exe")
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/build-worker-exe.ps1 -OutputPath $output
          if (-not (Test-Path -LiteralPath $output -PathType Leaf)) { throw 'Worker executable was not produced.' }
          $result = & $output --joy-worker-self-test
          if ($LASTEXITCODE -ne 0 -or $result -notmatch '"ok"\s*:\s*true') { throw 'Worker executable self-test failed.' }
          $evidence = Join-Path $env:RUNNER_TEMP ("joy-media-windows-acceptance-" + "${{ matrix.pass }}.json")
          & powershell -NoProfile -ExecutionPolicy Bypass -File ops/self-hosted/windows-runner/worker-acceptance.ps1 `
            -CandidateSha $env:CANDIDATE_SHA `
            -RunId $env:GITHUB_RUN_ID `
            -Attempt $env:GITHUB_RUN_ATTEMPT `
            -Pass "${{ matrix.pass }}" `
            -ExecutablePath $output `
            -OutputPath $evidence
          if (-not (Test-Path -LiteralPath $evidence -PathType Leaf)) { throw 'Windows Worker acceptance evidence was not produced.' }
      - name: Publish Windows Worker acceptance evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: joy-media-windows-acceptance-${{ matrix.pass }}
          path: ${{ runner.temp }}/joy-media-windows-acceptance-${{ matrix.pass }}.json
          if-no-files-found: error
          retention-days: 7
      - name: Verify clean Worker teardown
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $statePath = Join-Path $env:RUNNER_TEMP 'joy-media-release-state'
          if (Test-Path -LiteralPath $statePath) { throw 'clean Worker state leaked into the runner temp directory' }
          $leakedWorkers = @(Get-Process -Name 'joy-worker' -ErrorAction SilentlyContinue)
          if ($leakedWorkers.Count -gt 0) {
            $leakedWorkers | Stop-Process -Force
            throw 'clean Worker teardown found a leaked joy-worker process'
          }

  acceptance:
    name: acceptance (pass ${{ matrix.pass }})
    runs-on: [self-hosted, linux, x64, joy-media-acceptance]
    needs: [validate-candidate, linux-real-services, windows-worker-clean]
    strategy:
      fail-fast: false
      matrix:
        pass: [1, 2]
        profile:
          [
            desktop-primary,
            desktop-compact,
            desktop-minimum,
            desktop-1280,
            desktop-1440,
            desktop-1581,
            desktop-1920,
          ]
    timeout-minutes: 60
    env:
      # This job intentionally exercises the cheap fixture stack. The same
      # isolated runner is reused by the real-service job below, whose
      # runner-local profile remains real-services.
      JOY_MEDIA_CI_ACCEPTANCE_PROFILE: fixture-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify fixture-only acceptance boundary
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'candidate_sha must be a full lowercase commit SHA' >&2; exit 1; }
          test "${JOY_MEDIA_CI_ACCEPTANCE_PROFILE:-}" = 'fixture-only' || { echo 'JOY_MEDIA_CI_ACCEPTANCE_PROFILE=fixture-only is required' >&2; exit 1; }
          node --version
          corepack enable pnpm
          pnpm --version
          test -z "${JOY_MEDIA_OPENCLI_PROFILE:-}" || { echo 'OpenCLI profiles are forbidden on acceptance runners' >&2; exit 1; }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec playwright install chromium
      - name: Run disposable desktop acceptance journeys
        shell: bash
        env:
          CI: true
          PLAYWRIGHT_WORKERS: 1
          PLAYWRIGHT_HTML_REPORT: ${{ runner.temp }}/joy-media-playwright-report-acceptance-${{ matrix.profile }}-${{ matrix.pass }}-${{ github.run_id }}-${{ github.run_attempt }}
          PLAYWRIGHT_TEST_RESULTS_DIR: ${{ runner.temp }}/joy-media-playwright-results-acceptance-${{ matrix.profile }}-${{ matrix.pass }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: pnpm exec playwright test tests/e2e --project=${{ matrix.profile }} --workers=1
      - name: Verify acceptance teardown
        if: always()
        shell: bash
        env:
          PLAYWRIGHT_HTML_REPORT: ${{ runner.temp }}/joy-media-playwright-report-acceptance-${{ matrix.profile }}-${{ matrix.pass }}-${{ github.run_id }}-${{ github.run_attempt }}
          PLAYWRIGHT_TEST_RESULTS_DIR: ${{ runner.temp }}/joy-media-playwright-results-acceptance-${{ matrix.profile }}-${{ matrix.pass }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          for output_path in "$PLAYWRIGHT_HTML_REPORT" "$PLAYWRIGHT_TEST_RESULTS_DIR"; do
            case "$output_path" in
              "$RUNNER_TEMP"/*) ;;
              *) echo "refusing to clean output outside RUNNER_TEMP: $output_path" >&2; exit 1 ;;
            esac
            rm -rf -- "$output_path"
            test ! -e "$output_path"
          done
          test -z "$(git status --porcelain)"

  real-service-acceptance:
    name: real-service-acceptance (pass ${{ matrix.pass }})
    runs-on: [self-hosted, linux, x64, joy-media-acceptance]
    needs: [validate-candidate, acceptance, windows-worker-clean]
    strategy:
      fail-fast: false
      matrix:
        pass: [1, 2]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify real-service acceptance prerequisites
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'candidate_sha must be a full lowercase commit SHA' >&2; exit 1; }
          test "${JOY_MEDIA_CI_ACCEPTANCE_PROFILE:-}" = 'real-services' || { echo 'JOY_MEDIA_CI_ACCEPTANCE_PROFILE=real-services is required' >&2; exit 1; }
          test "${JOY_MEDIA_CI_ACCEPTANCE_WORKER:-}" = 'disposable' || { echo 'JOY_MEDIA_CI_ACCEPTANCE_WORKER=disposable is required' >&2; exit 1; }
          test -z "${JOY_MEDIA_OPENCLI_PROFILE:-}" || { echo 'OpenCLI profiles are forbidden on acceptance runners' >&2; exit 1; }
          command -v node >/dev/null || { echo 'Node 22 is required on the acceptance runner' >&2; exit 1; }
          corepack enable pnpm
          pnpm --version
          acceptance_command="${JOY_MEDIA_CI_REAL_ACCEPTANCE_COMMAND:-}"
          test -n "$acceptance_command" && test -x "$acceptance_command" || {
            echo 'JOY_MEDIA_CI_REAL_ACCEPTANCE_COMMAND must point to the isolated real-service acceptance harness' >&2
            exit 1
          }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec playwright install chromium
      - name: Fetch Windows Worker acceptance evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: joy-media-windows-acceptance-${{ matrix.pass }}
          path: test-output/windows
      - name: Bind Windows evidence to the gate contract
        shell: bash
        run: |
          set -euo pipefail
          artifact="test-output/windows/joy-media-windows-acceptance-${{ matrix.pass }}.json"
          test -s "$artifact" || { echo "Windows acceptance artifact is missing: $artifact" >&2; exit 1; }
          cp -- "$artifact" test-output/windows/acceptance.json
          test -s test-output/windows/acceptance.json
      - name: Run authenticated real-service desktop acceptance and evidence
        shell: bash
        run: |
          set -euo pipefail
          # The runner-local harness owns disposable auth, PostgreSQL/object
          # namespaces, Worker identity, and all seven desktop profiles. It
          # must emit only redacted, candidate-bound evidence under test-output.
          acceptance_command="$JOY_MEDIA_CI_REAL_ACCEPTANCE_COMMAND"
          "$acceptance_command" "$CANDIDATE_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "${{ matrix.pass }}"
          for required in \
            test-output/browser/journeys.json \
            test-output/release-performance/polling.json \
            test-output/release-performance/effects-soak.json \
            test-output/release-performance/timeline-integrity.json \
            test-output/release-performance/editor.json \
            test-output/delivery/result.json \
            test-output/windows/acceptance.json \
            test-output/operations/restore.json; do
            test -s "$required" || { echo "required real-service evidence is missing: $required" >&2; exit 1; }
          done
      - name: Evaluate source-bound release gate
        shell: bash
        env:
          JOY_RELEASE_OUTPUT: ${{ runner.temp }}/joy-media-release-gate-${{ matrix.pass }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          pnpm run release:gate
      - name: Verify real-service acceptance teardown
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -z "${JOY_MEDIA_OPENCLI_PROFILE:-}"
          test -z "$(git status --porcelain)"
