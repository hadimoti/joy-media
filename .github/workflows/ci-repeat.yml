name: ci-repeat

# REPEATABILITY SIGNAL. NOT a release approval, NOT a required check.
#
# Weekly and non-blocking (plan §3.4, decision D21). It repeats the Vitest suite under synthetic CPU load on a hosted
# runner and writes a small receipt (flake-counts.json) with the failed test IDs and the number of "onTaskUpdate" RPC
# timeouts per pass. Its evidence is about repeatability only. It never publishes, deploys, tags, merges or changes branch
# protection, and it never touches the release gate.
#
# Activation: GitHub runs a scheduled workflow only from the default branch, so this file does nothing until it is merged
# to main. That merge needs the owner's approval (D21). A dispatch on a feature branch is allowed for review.
#
# The two self-hosted repeats in the plan (the Windows lifecycle and the real-service lane) are not in this file yet. They
# reuse jobs from the v3 pipeline, which has to be shadow-proven first (D18).
#
# TRIGGERS: a weekly schedule and manual dispatch only.

on:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:
    inputs:
      runs:
        description: 'Loaded Vitest passes to run in this job (the plan needs 30 or more across the weeks)'
        required: false
        default: '3'
        type: string

concurrency:
  group: ci-repeat
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  vitest-under-load:
    name: Vitest under synthetic CPU load (repeat signal, non-blocking)
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      REPEAT_RUNS: ${{ inputs.runs || '3' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Install pinned FFmpeg (BtbN n8.1.3-24-g92611900bb, SHA-256 verified)
        shell: bash
        env:
          FFMPEG_URL: https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-10-23-13-04/ffmpeg-n8.1.3-24-g92611900bb-linux64-gpl-8.1.tar.xz
          FFMPEG_SHA256: d0eb612b8994407f78413e2929cb4b073bc699c8ab79e198b31624736fdc2f93
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/ffmpeg-linux64.tar.xz"
          curl --fail --location --silent --show-error --retry 3 --output "$archive" "$FFMPEG_URL"
          echo "$FFMPEG_SHA256  $archive" | sha256sum --check --strict
          tar -xJf "$archive" -C "$RUNNER_TEMP"
          bin_dir="$RUNNER_TEMP/ffmpeg-n8.1.3-24-g92611900bb-linux64-gpl-8.1/bin"
          version_output="$("$bin_dir/ffmpeg" -version)"
          case "$version_output" in
            *'n8.1.3-24-g92611900bb'*) ;;
            *) echo 'pinned FFmpeg build identity not found in ffmpeg -version' >&2; exit 1 ;;
          esac
          "$bin_dir/ffprobe" -version > /dev/null
          echo "$bin_dir" >> "$GITHUB_PATH"
      - name: Verify runner toolchain
        shell: bash
        run: |
          set -euo pipefail
          node --version
          corepack enable pnpm
          pnpm --version
          ffmpeg -version > /dev/null
          ffprobe -version > /dev/null
      - run: pnpm install --frozen-lockfile
      - name: Run loaded Vitest passes and write the flake receipt
        run: node tooling/release/src/vitest-load-repeat.mjs --runs "$REPEAT_RUNS" --out "$RUNNER_TEMP/ci-repeat"
      - name: Upload the flake receipt (receipt only, 30 days)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-repeat-flake-counts-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-repeat/flake-counts.json
          if-no-files-found: error
          retention-days: 30
